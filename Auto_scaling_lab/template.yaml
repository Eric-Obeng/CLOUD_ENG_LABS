AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Highly Available Auto-Scaling Web Tier with Application Load Balancer.
  Deploys a full VPC with public/private subnets across 2 AZs, NAT Gateway,
  ALB, Auto Scaling Group with CPU-based scaling policies, and Apache web
  servers that display instance metadata and provide a CPU stress mechanism.

# =============================================================================
# PARAMETERS - Make the template reusable across regions and instance sizes
# =============================================================================
Parameters:
  LatestAmiId:
    Description: Amazon Linux 2 AMI ID for eu-west-1
    Type: String
    Default: "ami-06422669907866d20"

  InstanceType:
    Description: EC2 instance type for the web servers
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small

  VpcCidr:
    Description: CIDR block for the VPC
    Type: String
    Default: "10.0.0.0/16"

Resources:
  # ===========================================================================
  # SECTION 1: VPC & SUBNETS
  # ---------------------------------------------------------------------------
  # WHY: We need an isolated network. The VPC is our private cloud inside AWS.
  #      Public subnets get internet access (for ALB + NAT Gateway).
  #      Private subnets have NO direct internet access (for EC2 security).
  #      We use 2 AZs for high availability — if one AZ goes down, the other
  #      keeps serving traffic.
  # ===========================================================================

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: AutoScale-VPC

  # --- Public Subnets (ALB + NAT Gateway live here) ---
  # MapPublicIpOnLaunch: true means resources here CAN get public IPs

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.1.0/24"
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Public-Subnet-AZ1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.2.0/24"
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Public-Subnet-AZ2

  # --- Private Subnets (EC2 instances live here — NOT internet-accessible) ---
  # No MapPublicIpOnLaunch — instances here are hidden from the internet

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.3.0/24"
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: Private-Subnet-AZ1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.4.0/24"
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: Private-Subnet-AZ2

  # ===========================================================================
  # SECTION 2: INTERNET GATEWAY
  # ---------------------------------------------------------------------------
  # WHY: The IGW is the "front door" of our VPC. Without it, nothing inside
  #      the VPC can reach the internet (and the internet can't reach in).
  #      We attach it to the VPC, then route public subnet traffic through it.
  # ===========================================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: AutoScale-IGW

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ===========================================================================
  # SECTION 3: NAT GATEWAY
  # ---------------------------------------------------------------------------
  # WHY: EC2 instances in private subnets can't reach the internet directly
  #      (that's the point — security). But they NEED outbound internet to
  #      install packages (yum install httpd). The NAT Gateway solves this:
  #
  #      Private EC2 → NAT Gateway (in public subnet) → Internet Gateway → Web
  #
  #      Traffic flows OUT but nothing can initiate a connection IN.
  #      The Elastic IP gives the NAT Gateway a fixed public address.
  #
  # COST NOTE: NAT Gateways cost ~$0.045/hr + data processing fees.
  #            We use ONE NAT Gateway (not one per AZ) to minimize costs.
  #            For production, you'd want one per AZ for resilience.
  # ===========================================================================

  NATGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: IGWAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: NAT-EIP

  NATGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: AutoScale-NAT

  # ===========================================================================
  # SECTION 4: ROUTE TABLES
  # ---------------------------------------------------------------------------
  # WHY: Subnets don't automatically know WHERE to send traffic. Route tables
  #      are the "road maps":
  #
  #      Public Route Table:  0.0.0.0/0 → Internet Gateway (direct internet)
  #      Private Route Table: 0.0.0.0/0 → NAT Gateway (internet via NAT)
  #
  #      Each subnet must be ASSOCIATED with a route table to use its routes.
  #      Without association, subnets use the VPC's default (implicit) route
  #      table which only has the local VPC route.
  # ===========================================================================

  # --- Public Route Table: Internet via IGW ---
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: Public-RT

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  PublicSubnet1RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # --- Private Route Table: Internet via NAT Gateway ---
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: Private-RT

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NATGateway

  PrivateSubnet1RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ===========================================================================
  # SECTION 5: SECURITY GROUPS
  # ---------------------------------------------------------------------------
  # WHY: Security Groups are virtual firewalls for each resource.
  #
  #      ALB Security Group:
  #        - Inbound:  Allow HTTP (port 80) from ANYWHERE (0.0.0.0/0)
  #        - Outbound: Allow all (default)
  #        → Users need to reach the ALB from the internet
  #
  #      EC2 Security Group:
  #        - Inbound:  Allow HTTP (port 80) ONLY from the ALB Security Group
  #        - Outbound: Allow all (default — needed for NAT Gateway access)
  #        → EC2 instances should ONLY accept traffic from the load balancer
  #        → NO SSH (port 22) access — a security requirement
  #
  # KEY CONCEPT: We reference the ALB's Security Group ID as the source,
  #              NOT a CIDR block. This means "only allow traffic that
  #              originated from a resource in the ALB security group."
  # ===========================================================================

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP from the internet to the ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: Name
          Value: ALB-SG

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP from the ALB only - no SSH access
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: EC2-SG

  # ===========================================================================
  # SECTION 6: APPLICATION LOAD BALANCER
  # ---------------------------------------------------------------------------
  # WHY: The ALB is the SINGLE PUBLIC ENDPOINT users interact with.
  #      It receives all HTTP requests and distributes them across healthy
  #      EC2 instances using round-robin. Users never know how many servers
  #      exist behind the scenes.
  #
  #      Three pieces work together:
  #      1. Load Balancer — the internet-facing entry point (in public subnets)
  #      2. Target Group  — the pool of EC2 instances + health check config
  #      3. Listener      — the rule: "HTTP on port 80 → forward to target group"
  #
  #      Health checks ping "/" every 30 seconds. If an instance fails 3 checks,
  #      the ALB stops sending traffic to it. This prevents users from hitting
  #      broken instances.
  # ===========================================================================

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: AutoScale-ALB
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: AutoScale-ALB

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: AutoScale-TG
      Protocol: HTTP
      Port: 80
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      Tags:
        - Key: Name
          Value: AutoScale-TG

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  # ===========================================================================
  # SECTION 7: LAUNCH TEMPLATE
  # ---------------------------------------------------------------------------
  # WHY: The Launch Template is the "blueprint" for every EC2 instance the ASG
  #      creates. It defines: AMI, instance type, security group, and most
  #      importantly — the User Data script.
  #
  #      User Data runs ONCE when an instance first boots. Our script:
  #      1. Installs Apache HTTP Server (httpd)
  #      2. Installs the 'stress' tool for CPU stress testing
  #      3. Fetches instance metadata (ID, IP, AZ) using IMDSv2
  #      4. Creates an HTML page that displays instance info
  #      5. Creates a CGI script that triggers CPU stress on button click
  #
  #      IMDSv2 (Instance Metadata Service v2) requires a token — this is
  #      the secure way to fetch metadata. The old way (IMDSv1) is being
  #      deprecated.
  # ===========================================================================

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: AutoScale-LT
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: false
            Groups:
              - !Ref EC2SecurityGroup
        UserData:
          Fn::Base64: |
            #!/bin/bash -xe
            # ==============================================================
            # EC2 USER DATA SCRIPT
            # This runs automatically on first boot of every new instance.
            # ==============================================================

            # --- Step 1: Install packages ---
            # httpd = Apache web server
            # stress-ng = CPU load generator (available in AL2023 default repos)
            yum update -y
            yum install -y httpd stress-ng

            # Start and enable Apache so it survives reboots
            systemctl start httpd
            systemctl enable httpd

            # --- Step 2: Fetch instance metadata using IMDSv2 ---
            # First get a session token (IMDSv2 security requirement)
            TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
              -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")

            # Then use the token to fetch metadata
            INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/instance-id)
            PRIVATE_IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/local-ipv4)
            AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/placement/availability-zone)

            # --- Step 3: Create the web application HTML ---
            cat > /var/www/html/index.html << 'HTMLEOF'
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Auto Scaling Demo</title>
              <style>
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body {
                  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
                  min-height: 100vh;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  padding: 20px;
                  color: #e0e0e0;
                }
                .card {
                  background: rgba(255,255,255,0.05);
                  backdrop-filter: blur(10px);
                  border: 1px solid rgba(255,255,255,0.1);
                  border-radius: 16px;
                  padding: 40px;
                  max-width: 540px;
                  width: 100%;
                }
                h1 {
                  font-size: 26px;
                  color: #fff;
                  margin-bottom: 6px;
                }
                .subtitle {
                  color: #aaa;
                  margin-bottom: 28px;
                  font-size: 14px;
                }
                .info-grid {
                  display: grid;
                  gap: 10px;
                  margin-bottom: 28px;
                }
                .info-item {
                  background: rgba(255,255,255,0.06);
                  border: 1px solid rgba(255,255,255,0.08);
                  border-radius: 10px;
                  padding: 14px 18px;
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                }
                .info-item .label {
                  color: #999;
                  font-size: 13px;
                  font-weight: 500;
                }
                .info-item .value {
                  color: #7ec8e3;
                  font-weight: 600;
                  font-family: 'Courier New', monospace;
                  font-size: 14px;
                }
                .stress-btn {
                  width: 100%;
                  padding: 14px;
                  border: none;
                  border-radius: 10px;
                  background: #e74c3c;
                  color: white;
                  font-size: 16px;
                  font-weight: 600;
                  cursor: pointer;
                  transition: all 0.3s ease;
                  letter-spacing: 0.5px;
                }
                .stress-btn:hover {
                  background: #c0392b;
                  transform: translateY(-2px);
                  box-shadow: 0 4px 15px rgba(231,76,60,0.4);
                }
                .stress-btn:disabled {
                  background: #555;
                  cursor: not-allowed;
                  transform: none;
                  box-shadow: none;
                }
                .stress-btn.running {
                  background: #e67e22;
                  animation: pulse 2s infinite;
                }
                @keyframes pulse {
                  0%, 100% { box-shadow: 0 0 0 0 rgba(230,126,34,0.4); }
                  50% { box-shadow: 0 0 0 10px rgba(230,126,34,0); }
                }
                .status {
                  text-align: center;
                  margin-top: 14px;
                  font-size: 13px;
                  color: #999;
                  min-height: 20px;
                }
                .divider {
                  border: none;
                  border-top: 1px solid rgba(255,255,255,0.08);
                  margin: 20px 0;
                }
                .refresh-note {
                  text-align: center;
                  font-size: 12px;
                  color: #666;
                  line-height: 1.5;
                }
                .highlight { color: #7ec8e3; }
              </style>
            </head>
            <body>
              <div class="card">
                <h1>&#9889; Auto Scaling Demo</h1>
                <p class="subtitle">Served by an EC2 instance behind an Application Load Balancer</p>

                <div class="info-grid">
                  <div class="info-item">
                    <span class="label">Instance ID</span>
                    <span class="value">INSTANCE_ID_PLACEHOLDER</span>
                  </div>
                  <div class="info-item">
                    <span class="label">Private IP</span>
                    <span class="value">PRIVATE_IP_PLACEHOLDER</span>
                  </div>
                  <div class="info-item">
                    <span class="label">Availability Zone</span>
                    <span class="value">AZ_PLACEHOLDER</span>
                  </div>
                </div>

                <button class="stress-btn" id="stressBtn" onclick="triggerStress()">
                  &#128293; Trigger CPU Stress Test
                </button>
                <p class="status" id="status"></p>

                <hr class="divider">
                <p class="refresh-note">
                  <span class="highlight">Tip:</span> Refresh this page multiple times.<br>
                  If the <span class="highlight">Instance ID changes</span>, the ALB is
                  distributing traffic across multiple instances.
                </p>
              </div>

              <script>
                function triggerStress() {
                  var btn = document.getElementById('stressBtn');
                  var status = document.getElementById('status');

                  btn.disabled = true;
                  btn.classList.add('running');
                  btn.innerHTML = '&#9889; Stress Test Running...';
                  status.textContent = 'Sending stress request to this instance...';

                  fetch('/cgi-bin/stress.sh')
                    .then(function(response) { return response.text(); })
                    .then(function(data) {
                      status.innerHTML = '&#9989; CPU stress active! CloudWatch will detect high CPU in ~2 min.<br>New instances should appear in ~3-5 min.';
                      btn.innerHTML = '&#128293; Stress Test Active (5 min)';
                      setTimeout(function() {
                        btn.disabled = false;
                        btn.classList.remove('running');
                        btn.innerHTML = '&#128293; Trigger CPU Stress Test';
                        status.textContent = 'Stress test completed.';
                      }, 300000);
                    })
                    .catch(function(err) {
                      status.textContent = 'Error: ' + err.message;
                      btn.disabled = false;
                      btn.classList.remove('running');
                      btn.innerHTML = '&#128293; Trigger CPU Stress Test';
                    });
                }
              </script>
            </body>
            </html>
            HTMLEOF

            # --- Step 4: Inject actual instance metadata into the HTML ---
            sed -i "s/INSTANCE_ID_PLACEHOLDER/$INSTANCE_ID/g" /var/www/html/index.html
            sed -i "s/PRIVATE_IP_PLACEHOLDER/$PRIVATE_IP/g" /var/www/html/index.html
            sed -i "s/AZ_PLACEHOLDER/$AZ/g" /var/www/html/index.html

            # --- Step 5: Enable CGI execution in Apache ---
            # Apache on AL2023 does not enable ExecCGI by default.
            # Without this config, clicking the stress button returns 403 Forbidden.
            cat > /etc/httpd/conf.d/cgi-enable.conf << 'CGICONFEOF'
            <Directory "/var/www/cgi-bin">
                Options +ExecCGI
                AddHandler cgi-script .sh
            </Directory>
            CGICONFEOF

            # --- Step 6: Create CGI script for CPU stress trigger ---
            # This is called when the user clicks the stress button.
            # It runs 4 CPU-intensive processes for 300 seconds (5 minutes).
            # This will push CPU utilization well above the 30% threshold.
            cat > /var/www/cgi-bin/stress.sh << 'CGIEOF'
            #!/bin/bash
            echo "Content-Type: text/plain"
            echo ""
            echo "Starting CPU stress test..."
            nohup stress-ng --cpu 4 --timeout 300 > /dev/null 2>&1 &
            echo "4 CPU workers started for 300 seconds."
            CGIEOF

            chmod +x /var/www/cgi-bin/stress.sh

            # Restart Apache to pick up any config changes
            systemctl restart httpd

  # ===========================================================================
  # SECTION 8: AUTO SCALING GROUP
  # ---------------------------------------------------------------------------
  # WHY: The ASG manages the LIFECYCLE of EC2 instances:
  #      - Launches instances from the Launch Template
  #      - Maintains the desired count (replaces crashed instances)
  #      - Scales out (adds instances) when demand increases
  #      - Scales in (removes instances) when demand decreases
  #      - Registers new instances with the ALB Target Group automatically
  #
  #      Min=1:  Always at least 1 instance running (availability)
  #      Desired=1: Start with 1 instance (cost optimization)
  #      Max=4:  Never more than 4 (cost control)
  #
  #      VPCZoneIdentifier lists the private subnets — the ASG will
  #      distribute instances across both AZs automatically.
  #
  #      TargetGroupARNs connects the ASG to the ALB — every new instance
  #      is auto-registered with the target group.
  #
  #      HealthCheckType=ELB means the ASG trusts the ALB's health checks.
  #      If the ALB marks an instance unhealthy, the ASG replaces it.
  # ===========================================================================

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: AutoScale-ASG
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: "1"
      DesiredCapacity: "1"
      MaxSize: "4"
      VPCZoneIdentifier:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      TargetGroupARNs:
        - !Ref ALBTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: AutoScale-WebServer
          PropagateAtLaunch: true

  # ===========================================================================
  # SECTION 9: SCALING POLICY
  # ---------------------------------------------------------------------------
  # WHY: The scaling policy tells the ASG WHEN to add or remove instances.
  #
  #      We use Target Tracking Scaling — the simplest and most effective type.
  #      You set a target metric value (CPU = 30%), and AWS automatically:
  #      - Creates CloudWatch Alarms behind the scenes
  #      - Adds instances when CPU > 30% (scale out)
  #      - Removes instances when CPU < 30% (scale in)
  #      - Adjusts the number of instances to keep CPU near 30%
  #
  #      This is like a thermostat: you set the desired temperature (30% CPU),
  #      and the system adds/removes "heaters" (instances) to maintain it.
  #
  #      WHY 30%? This is a low threshold chosen for DEMONSTRATION purposes.
  #      In production, 60-70% is more typical. At 30%, our stress test
  #      easily triggers scale-out.
  # ===========================================================================

  CPUScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 30.0

  # ===========================================================================
  # OUTPUTS
  # ---------------------------------------------------------------------------
  # WHY: Outputs make key values easy to find after deployment.
  #      The ALB DNS name is the URL you give to stakeholders for testing.
  # ===========================================================================

Outputs:
  ALBDNSName:
    Description: DNS name of the Application Load Balancer (use this to access the app)
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-ALB-DNS"

  ALBEndpoint:
    Description: Full URL to access the web application
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"

  VPCId:
    Description: VPC ID for reference
    Value: !Ref VPC

  AutoScalingGroupName:
    Description: Name of the Auto Scaling Group
    Value: !Ref AutoScalingGroup


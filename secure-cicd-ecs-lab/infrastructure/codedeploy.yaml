AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Task 7a - CodeDeploy Application + Deployment Group for ECS blue/green
  deployments in secure-cicd-ecs-lab.

Parameters:
  LabName:
    Type: String
    Default: secure-cicd-ecs-lab

Resources:
  # ============================================================
  # CODEDEPLOY SERVICE ROLE - the role CodeDeploy itself assumes to
  # perform an ECS blue/green deployment: creating the green task set,
  # shifting ALB listener traffic, monitoring health, and eventually
  # terminating the old task set. AWS provides a managed policy that
  # covers exactly this (AWSCodeDeployRoleForECS) - no need to hand-
  # write these permissions ourselves.
  # ============================================================
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${LabName}-codedeploy-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS
      Tags:
        - Key: Name
          Value: !Sub ${LabName}-codedeploy-role

  # ============================================================
  # CODEDEPLOY APPLICATION - a logical container/namespace for
  # deployment groups. ComputePlatform=ECS tells CodeDeploy this
  # app deploys to ECS services (as opposed to EC2/Lambda).
  # ============================================================
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub ${LabName}-app
      ComputePlatform: ECS

  # ============================================================
  # DEPLOYMENT GROUP - the actual blue/green configuration. This is
  # where all the moving pieces connect: which ECS service, which
  # two target groups, which ALB listeners, and how traffic shifts.
  #
  # DeploymentConfigName=CodeDeployDefault.ECSAllAtOnce: shifts 100%
  # of traffic to green immediately once it's healthy (rather than
  # linear/canary percentages) - matches the "automatic, fast" choice
  # we made earlier.
  #
  # BlueGreenDeploymentConfiguration:
  #   - Traffic shifts immediately (no additional wait baked in here -
  #     that's what DeploymentConfigName above already controls)
  #   - TerminateBlueInstancesOnDeploymentSuccess with a 5 minute
  #     termination wait: keeps the OLD (blue) task set alive for 5
  #     minutes after cutover as a safety net, in case something looks
  #     wrong post-shift, before actually killing it.
  #
  # DeploymentReadyOption ActionOnTimeout=CONTINUE_DEPLOYMENT: since
  # we're not using the test listener as a hard manual gate, the
  # deployment proceeds automatically past the "ready" checkpoint
  # rather than waiting indefinitely for a manual signal.
  # ============================================================
  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub ${LabName}-deployment-group
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
      ECSServices:
        - ClusterName: !ImportValue
            Fn::Sub: ${LabName}-ClusterName
          ServiceName: !ImportValue
            Fn::Sub: ${LabName}-ServiceName
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - ProdTrafficRoute:
              ListenerArns:
                - !ImportValue
                  Fn::Sub: ${LabName}-HttpListenerArn
            TestTrafficRoute:
              ListenerArns:
                - !ImportValue
                  Fn::Sub: ${LabName}-TestListenerArn
            TargetGroups:
              - Name: !Sub ${LabName}-tg-blue
              - Name: !Sub ${LabName}-tg-green

Outputs:
  CodeDeployApplicationName:
    Value: !Ref CodeDeployApplication
    Export:
      Name: !Sub ${LabName}-CodeDeployApplicationName

  DeploymentGroupName:
    Value: !Ref DeploymentGroup
    Export:
      Name: !Sub ${LabName}-DeploymentGroupName

  CodeDeployServiceRoleArn:
    Value: !GetAtt CodeDeployServiceRole.Arn
    Export:
      Name: !Sub ${LabName}-CodeDeployServiceRoleArn

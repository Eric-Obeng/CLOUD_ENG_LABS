AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Task 7b - S3 artifact bucket + CodePipeline for secure-cicd-ecs-lab.
  Source: ECR image push + S3 (appspec/taskdef templates). Deploy: CodeDeployToECS.

Parameters:
  LabName:
    Type: String
    Default: secure-cicd-ecs-lab

Resources:
  # ============================================================
  # ARTIFACT BUCKET - CodePipeline stores intermediate artifacts here
  # between stages (e.g. the imageDetail.json from the ECR source
  # action). Also doubles as where we manually upload the appspec.yaml
  # + taskdef.json bundle (see TemplateBundleKey below), satisfying
  # the lab's "use S3 to host template files" requirement.
  #
  # Versioning is required here - the S3 source action detects new
  # pipeline runs based on object VERSION, not just key name.
  # BlockPublicAccess: this bucket is never meant to be public -
  # only CodePipeline/CodeDeploy (via IAM role) ever read from it.
  # ============================================================
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${LabName}-pipeline-artifacts-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: !Sub ${LabName}-pipeline-artifacts

  # ============================================================
  # CODEPIPELINE SERVICE ROLE - permissions CodePipeline needs to:
  #   - read/write the artifact bucket
  #   - read image details from ECR
  #   - trigger a CodeDeploy deployment
  #   - pass the CodeDeploy role along (PassRole) so CodeDeploy can
  #     act on ECS on the pipeline's behalf
  # Scoped to this lab's specific resources wherever possible rather
  # than blanket "*" permissions.
  # ============================================================
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${LabName}-codepipeline-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${LabName}-codepipeline-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ArtifactBucketAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/*
              - Sid: EcrSourceAccess
                Effect: Allow
                Action:
                  - ecr:DescribeImages
                  - ecr:GetAuthorizationToken
                  - ecr:BatchGetImage
                Resource: "*"
              - Sid: CodeDeployTrigger
                Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetApplication
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:GetDeploymentGroup
                  - codedeploy:GetApplicationRevision
                  - codedeploy:RegisterApplicationRevision
                Resource: "*"
              - Sid: EcsRegisterTaskDef
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                Resource: "*"
              - Sid: PassEcsRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !ImportValue
                    Fn::Sub: ${LabName}-TaskExecutionRoleArn
                  - !ImportValue
                    Fn::Sub: ${LabName}-TaskRoleArn

  # ============================================================
  # CODEPIPELINE - the orchestrator. Source stage pulls from TWO
  # places (ECR + S3 template bundle) in parallel; Deploy stage
  # hands both artifacts to CodeDeployToECS, which performs the
  # actual blue/green swap via the CodeDeploy deployment group
  # from Task 7a.
  # ============================================================
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${LabName}-pipeline
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            # ECR source - this is what EventBridge triggers. Produces
            # imageDetail.json describing exactly which image/digest
            # was just pushed.
            - Name: ImageSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: ECR
                Version: "1"
              Configuration:
                RepositoryName: !ImportValue
                  Fn::Sub: ${LabName}-EcrRepositoryName
                ImageTag: latest
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

            # S3 source - pulls the appspec.yaml + taskdef.json bundle
            # you upload manually (see deployment notes). Rarely
            # changes, but must be versioned in the bucket for the
            # pipeline to reference a specific object version.
            - Name: TemplateSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: "1"
              Configuration:
                S3Bucket: !Ref ArtifactBucket
                S3ObjectKey: templates/pipeline-templates.zip
                PollForSourceChanges: false
              OutputArtifacts:
                - Name: TemplateArtifact
              RunOrder: 1

        - Name: Deploy
          Actions:
            - Name: DeployToECS
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: "1"
              InputArtifacts:
                - Name: SourceArtifact
                - Name: TemplateArtifact
              Configuration:
                ApplicationName: !ImportValue
                  Fn::Sub: ${LabName}-CodeDeployApplicationName
                DeploymentGroupName: !ImportValue
                  Fn::Sub: ${LabName}-DeploymentGroupName
                TaskDefinitionTemplateArtifact: TemplateArtifact
                TaskDefinitionTemplatePath: taskdef.json
                AppSpecTemplateArtifact: TemplateArtifact
                AppSpecTemplatePath: appspec.yaml
                Image1ArtifactName: SourceArtifact
                Image1ContainerName: IMAGE1_NAME
              RunOrder: 1

Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
    Export:
      Name: !Sub ${LabName}-ArtifactBucketName

  PipelineName:
    Value: !Ref Pipeline
    Export:
      Name: !Sub ${LabName}-PipelineName

  PipelineArn:
    Value: !Sub arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}
    Export:
      Name: !Sub ${LabName}-PipelineArn

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Task 6 - GitHub OIDC trust + IAM role for GitHub Actions in secure-cicd-ecs-lab.
  Lets GitHub Actions assume a scoped AWS role with no stored long-lived credentials.

Parameters:
  LabName:
    Type: String
    Default: secure-cicd-ecs-lab

  # Format: <github-org-or-username>/<repo-name>
  GitHubRepo:
    Type: String
    Default: Eric-Obeng/CLOUD_ENG_LABS

  # Restricts which branch is allowed to assume this role. Using
  # "main" here means only pushes/workflows running on main can push
  # images - least privilege again, prevents random feature branches
  # from being able to push to production ECR.
  GitHubBranch:
    Type: String
    Default: main

  # IAM OIDC providers are account-wide, not per-project - AWS only
  # allows ONE provider per unique URL in an account. This account
  # already has a GitHub OIDC provider registered (from a previous
  # project), so instead of creating a new one (which fails with
  # "provider already exists"), we just reference the existing
  # provider's ARN directly in the role's trust policy below.
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: arn:aws:iam::288761743924:oidc-provider/token.actions.githubusercontent.com

Resources:
  # ============================================================
  # GITHUB ACTIONS ROLE - the role the workflow assumes via
  # AssumeRoleWithWebIdentity. The trust policy's Condition block is
  # what makes this safe: it checks the JWT's "sub" claim EXACTLY
  # matches our specific repo + branch, so no other GitHub repo
  # anywhere (even in the same org) could assume this role, even if
  # they knew the role ARN.
  # ============================================================
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${LabName}-github-actions-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/${GitHubBranch}
      Tags:
        - Key: Name
          Value: !Sub ${LabName}-github-actions-role

  # ============================================================
  # ECR PUSH POLICY - scoped to ONLY this lab's ECR repository, and
  # only the actions needed to authenticate + push an image. The
  # GetAuthorizationToken action is required to be Resource: "*"
  # (AWS API limitation - it's a token endpoint, not repo-scoped),
  # but every other action is locked to our specific repo ARN.
  # ============================================================
  GitHubActionsEcrPolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Ref GitHubActionsRole
      PolicyName: !Sub ${LabName}-github-actions-ecr-push
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EcrAuth
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: "*"
          - Sid: EcrPushToThisRepoOnly
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
            Resource: !ImportValue
              Fn::Sub: ${LabName}-EcrRepositoryArn

Outputs:
  GitHubActionsRoleArn:
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: !Sub ${LabName}-GitHubActionsRoleArn

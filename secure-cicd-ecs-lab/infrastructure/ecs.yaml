AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Task 4b - ECS Fargate cluster, task definition, and service for secure-cicd-ecs-lab.
  Tasks run in private subnets, registered behind the ALB's blue target group.
  Deployment controller set to CODE_DEPLOY (Task 7) so CodeDeploy manages
  blue/green traffic shifting instead of ECS's default rolling update.

Parameters:
  LabName:
    Type: String
    Default: secure-cicd-ecs-lab

  ContainerPort:
    Type: Number
    Default: 3000

  # Placeholder image used the FIRST time this stack deploys, before
  # GitHub Actions (Task 7) has ever pushed a real build. You'll build
  # and push one real image manually to validate this stack, then hand
  # off to CI/CD afterward. See deployment notes below.
  ContainerImage:
    Type: String
    Description: Full ECR image URI (repo:tag) to deploy initially.
    Default: 288761743924.dkr.ecr.eu-central-1.amazonaws.com/secure-cicd-ecs-lab-app:sha-d3b7c89

  TaskCpu:
    Type: String
    Default: "256"

  TaskMemory:
    Type: String
    Default: "512"

Resources:
  # ============================================================
  # ECS CLUSTER - logical grouping for our Fargate service. With
  # Fargate there's no EC2 capacity to manage - the cluster is
  # just a namespace/boundary for services, tasks, and metrics.
  # ============================================================
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${LabName}-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: !Sub ${LabName}-cluster

  # ============================================================
  # CLOUDWATCH LOG GROUP - where container stdout/stderr lands.
  # Created explicitly (rather than letting ECS auto-create it)
  # so we control the retention period and naming.
  # ============================================================
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${LabName}
      RetentionInDays: 14

  # ============================================================
  # TASK EXECUTION ROLE - used by the ECS AGENT (not your app code)
  # to do the plumbing needed to start a task:
  #   - pull the image from ECR
  #   - write logs to CloudWatch
  # This is infrastructure plumbing, kept separate from...
  # ============================================================
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${LabName}-task-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Name
          Value: !Sub ${LabName}-task-execution-role

  # ============================================================
  # ...the TASK ROLE - used by YOUR APPLICATION CODE at runtime if
  # it needs to call any AWS API (S3, DynamoDB, etc). Our Node/Express
  # app doesn't need AWS access yet, so this role has no permissions
  # attached beyond the trust policy. Kept separate from the execution
  # role on purpose - the app should never inherit ECR/logs permissions
  # it doesn't need (least privilege again).
  # ============================================================
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${LabName}-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Name
          Value: !Sub ${LabName}-task-role

  # ============================================================
  # TASK DEFINITION - the blueprint for a running container: image,
  # CPU/memory, port, logging config, and which roles it uses.
  # NetworkMode=awsvpc is mandatory for Fargate - it gives every
  # task its own ENI (and thus its own private IP + security group),
  # which is exactly what lets our EcsTaskSecurityGroup (Task 2)
  # apply directly to each task.
  # ============================================================
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${LabName}-task
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: !Sub ${LabName}-container
          Image: !Ref ContainerImage
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  # ============================================================
  # ECS SERVICE - keeps the desired number of tasks running,
  # registers/deregisters them with the ALB target group, and
  # replaces unhealthy tasks automatically.
  #
  # Tasks run in the PRIVATE subnets with AssignPublicIp=DISABLED -
  # they have no public IP and no internet route (Task 1), reaching
  # ECR/Logs purely through VPC endpoints.
  #
  # DeploymentController=CODE_DEPLOY hands deployment orchestration
  # over to CodeDeploy entirely (Task 7). From this point on, actual
  # task definition updates/rollouts happen via CodeDeploy blue/green
  # task set swaps - NOT ECS's default rolling update, and NOT future
  # CloudFormation stack updates to TaskDefinition/LoadBalancers on
  # this resource (CodeDeploy becomes the source of truth for "what's
  # actually running" once deployments start happening through it).
  # ============================================================
  EcsService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub ${LabName}-service
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split
            - ","
            - !ImportValue
              Fn::Sub: ${LabName}-PrivateSubnetIds
          SecurityGroups:
            - !ImportValue
              Fn::Sub: ${LabName}-EcsTaskSecurityGroupId
      LoadBalancers:
        - ContainerName: !Sub ${LabName}-container
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !ImportValue
            Fn::Sub: ${LabName}-BlueTargetGroupArn
      Tags:
        - Key: Name
          Value: !Sub ${LabName}-service

  # ============================================================
  # AUTO SCALING - Application Auto Scaling watches the ECS
  # service's average CPU utilization and adjusts DesiredCount
  # between 1 and 4 tasks. Uses the AWS-managed service-linked
  # role for Application Auto Scaling (no RoleARN needed).
  # ============================================================
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ResourceId: !Sub service/${EcsCluster}/${EcsService.Name}
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: 1
      MaxCapacity: 4

  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${LabName}-cpu-scaling
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 60
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

Outputs:
  ClusterName:
    Value: !Ref EcsCluster
    Export:
      Name: !Sub ${LabName}-ClusterName

  ServiceName:
    Value: !GetAtt EcsService.Name
    Export:
      Name: !Sub ${LabName}-ServiceName

  TaskDefinitionArn:
    Value: !Ref TaskDefinition
    Export:
      Name: !Sub ${LabName}-TaskDefinitionArn

  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
    Export:
      Name: !Sub ${LabName}-TaskExecutionRoleArn

  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
    Export:
      Name: !Sub ${LabName}-TaskRoleArn

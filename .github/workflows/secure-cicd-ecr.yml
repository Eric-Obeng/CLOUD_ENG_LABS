name: Secure CI/CD to Amazon ECR

on:
    push:
        branches:
            - main

        paths:
            - "secure-cicd-ecr-lab/**"
            - ".github/workflows/secure-cicd-ecr.yml"

    workflow_dispatch:

permissions:
    contents: read
    id-token: write

env:
    AWS_REGION: eu-central-1
    ECR_REPOSITORY: secure-cicd-ecr-lab
    IMAGE_TAG: latest

jobs:
    build-and-push:
        name: Build and push Docker image
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Configure AWS credentials using OIDC
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: arn:aws:iam::288761743924:role/github-actions-ecr-role
                  aws-region: ${{ env.AWS_REGION }}
                  role-session-name: GitHubActionsECRSession
                  allowed-account-ids: "288761743924"

            - name: Log in to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build Docker image
              working-directory: secure-cicd-ecr-lab
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
              run: |
                  set -euo pipefail
                  docker build \
                    --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
                    .

            - name: Push Docker image
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
              run: |
                  set -euo pipefail
                  docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

name: Build and Push to ECR

# Only trigger when application code changes, and only on main -
# since this is a monorepo (infra + app in one repo), the path
# filter stops infra-only commits from triggering a rebuild.
on:
    push:
        branches: [main]
        paths:
            - "secure-cicd-ecs-lab/application/**"
            - ".github/workflows/build-and-push.yml"

    workflow_dispatch:

# Required for OIDC: this grants the workflow permission to request
# the JWT it presents to AWS STS. Without id-token: write, the
# aws-actions/configure-aws-credentials step below cannot get a token.
permissions:
    id-token: write
    contents: read

env:
    AWS_REGION: eu-central-1
    ECR_REPOSITORY: secure-cicd-ecs-lab-app
    # Replace <ACCOUNT_ID> after deploying github-oidc.yaml - or better,
    # copy the GitHubActionsRoleArn output value directly here.
    ROLE_ARN: arn:aws:iam::288761743924:role/secure-cicd-ecs-lab-github-actions-role

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: secure-cicd-ecs-lab/application

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # No AWS access keys anywhere - this exchanges GitHub's OIDC
            # token for short-lived AWS credentials via AssumeRoleWithWebIdentity.
            - name: Configure AWS credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ env.ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              id: ecr-login
              uses: aws-actions/amazon-ecr-login@v2

            # Tagging strategy: every push produces a unique, precise tag
            # (sha-<short-sha>) AND moves the floating "latest" tag to the
            # same image. CodeDeploy/EventBridge downstream will react to
            # the new image push regardless of which tag triggered it, but
            # having the sha tag means we always know exactly which commit
            # is running, even though the repo itself allows mutable tags.
            - name: Build, tag, and push image
              env:
                  ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
              run: |
                  SHA_TAG="sha-${GITHUB_SHA::7}"
                  docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$SHA_TAG \
                                -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY:$SHA_TAG
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
                  echo "Pushed $ECR_REGISTRY/$ECR_REPOSITORY:$SHA_TAG"
